<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sigmund:re · Free Online Games</title>
  <meta name="description" content="Play 2,500+ free browser, Flash and retro games. Sigmund, remade: a new Daily Drop every day.">
  <meta name="theme-color" content="#0b0b0c">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=2026-09-23-5">
  <script>
    /* Tab cloak: apply the saved tab name + icon before the page paints (set in Settings, see CLOAKS in app.js). */
    try { var cl = JSON.parse(localStorage.getItem('sig:cloak')); if (cl && cl.title) { document.title = cl.title; var fi = document.querySelector('link[rel~="icon"]'); if (fi) { fi.removeAttribute('type'); fi.href = cl.icon; } } } catch (e) {}
    /* Apply saved settings before the page paints (keep defaults in sync with SETTINGS_DEFAULTS in app.js). */
    (function () {
      var o = { theme: 'black', accent: 'mustard', size: 'm', names: true, motion: true };
      try { var s = JSON.parse(localStorage.getItem('sig:settings')); if (s) for (var k in s) o[k] = s[k]; } catch (e) {}
      var t = o.theme === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'paper' : 'black') : o.theme;
      if (!/^[a-z0-9-]+$/.test(t)) t = 'black';
      var h = document.documentElement;
      h.dataset.theme = t; h.dataset.accent = o.accent; h.dataset.size = o.size;
      h.dataset.names = o.names ? 'on' : 'off'; h.dataset.motion = o.motion ? 'on' : 'off';
      var l = document.createElement('link'); l.rel = 'stylesheet'; l.id = 'themeCss'; l.href = 'assets/themes/' + t + '.css';
      document.head.appendChild(l);
    })();
  </script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="logo" href="#/" aria-label="Home">
        <span class="logo-box"><span id="brandA">Sigmund</span><span id="brandB">:re</span></span>
      </a>
      <div class="search">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search 2,500+ games…" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
        <div class="suggest" id="suggest" hidden></div>
      </div>
      <button class="tbtn" id="randomBtn" title="Random game"><span id="randomIco"></span><span class="tbtn-label">Surprise me</span></button>
      <button class="tbtn icon-only" id="settingsBtn" title="Settings" aria-label="Settings"></button>
    </div>
    <nav class="rail" id="rail" aria-label="Browse"></nav>
  </header>

  <main id="app" class="main" tabindex="-1"></main>

  <dialog class="settings" id="settings" aria-labelledby="setTitle"></dialog>

  <script src="assets/app.js?v=2026-09-23-5"></script>
</body>
</html>
