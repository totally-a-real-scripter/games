# Game Stash — nginx config. Listens on 3847 (set this as the exposed port in Coolify).
server {
    listen 3847;
    listen [::]:3847;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;


    location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

    location = /games.json { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/     { add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
    location /thumbnails/ { add_header Cache-Control "public, max-age=604800, immutable"; try_files $uri =404; }
    location /UGS-Files/  { add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }

    location / { try_files $uri $uri/ /index.html; }

    # Never serve helper scripts/data if they end up in the image
    location ~* \.(ps1|bat|csv|log|zip|docx)$ { return 404; }
}
