# Sigmund:re — nginx config. Listens on 3847 (set this as the exposed port in Coolify).
#
# Browse + AI: the Veil web proxy runs in the same container on 127.0.0.1:43117 (see proxy/ and
# docker/start.sh). nginx forwards /p/ (proxied pages) and /__px/ (its UI, AI, API) to it, behind the
# same password as everything else.
#
# Password gate: every page, game and thumbnail needs the lw_session cookie that the sign-in page sets.
# "/" always shows the sign-in page (login.html), so the password is needed on every visit and reload.
# After a correct password the sign-in page loads the site from /app into the same page.
# Any other address without a valid cookie sends visitors to "/".
# $sig_authed comes from 00-site-password.conf, which docker/40-site-password.sh writes at startup
# from the SITE_PASSWORD environment variable.

# Pages that work without signing in.
map $uri $sig_public {
    default             0;
    /auth-check         1;
    /logout             1;
    /healthz            1;
}
map $uri $sig_is_home {
    default     0;
    /           1;
    /index.html 1;
}
# Not public, not "/" and no valid cookie: redirect to "/".
map "$sig_public$sig_authed$sig_is_home" $sig_deny {
    default 0;
    "000"   1;
}
# Slow down password guessing: only visitors without a valid cookie are rate limited.
map $sig_authed $sig_limit_key {
    default $binary_remote_addr;
    1       "";
}
limit_req_zone $sig_limit_key zone=sig_login:1m rate=30r/m;

# --- Veil proxy (Browse + AI) ---
# Pages viewed through the proxy load root-relative URLs ("/api/x", "/assets/y") that must reach the
# proxy, not this site. Their Referer is a /p/... address; only signed-in visitors are forwarded.
map $http_referer $veil_ref {
    default                 0;
    "~^https?://[^/]+/p/"   1;
}
map "$sig_authed$veil_ref" $veil_from_page {
    default 0;
    "11"    1;
}
map $http_upgrade $veil_connection {
    default upgrade;
    ""      close;
}
# The proxy decides cookie "Secure" and redirects from the original scheme (Coolify terminates HTTPS).
map $http_x_forwarded_proto $veil_proto {
    default $scheme;
    https   https;
    http    http;
}
# The sign-in cookie is re-issued as HttpOnly after a correct password, so page scripts (including
# sites viewed through the proxy on this same address) can never read it.
map $veil_proto $sig_cookie_secure {
    default "";
    https   "; Secure";
}
upstream veil {
    server 127.0.0.1:43117;
    keepalive 16;
}

server {
    listen 3847;
    listen [::]:3847;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    limit_req zone=sig_login burst=30 nodelay;
    limit_req_status 429;

    # "/" is always the sign-in page; everything else needs the cookie. (Done with rewrite + try_files
    # rather than a plain 'return' so the limit_req above counts these requests too.)
    if ($sig_deny)    { rewrite ^ /__signin last; }
    # Root-relative requests from pages viewed through the proxy go to the proxy (see $veil_from_page).
    if ($veil_from_page) { return 419; }
    error_page 419 = @veil;
    if ($sig_is_home) { rewrite ^ /__signin-page last; }
    location = /__signin-page {
        internal;
        # Every visit to "/" signs out (the page's own script can't clear the HttpOnly cookie).
        add_header Set-Cookie "lw_session=; Path=/; Max-Age=0; SameSite=Lax; HttpOnly" always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
        try_files /login.html =404;
    }
    location = /__signin { internal; error_page 418 = @signin; try_files /__none =418; }
    location @signin { return 302 /; }

    location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

    # The sign-in page lives at "/"; don't serve it under its own name.
    location = /login.html { return 302 /; }
    # Sign out: clear the cookie and go back to the sign-in page.
    location = /logout {
        add_header Set-Cookie "lw_session=; Path=/; Max-Age=0; SameSite=Lax" always;
        add_header Cache-Control "no-store" always;
        return 302 /;
    }
    # The sign-in page asks this after setting the cookie: 204 = right password, 401 = wrong.
    location = /auth-check {
        if ($sig_authed) { rewrite ^ /__auth-ok last; }
        add_header Cache-Control "no-store" always;
        try_files /__none =401;
    }
    location = /__auth-ok {
        internal;
        # Same value (already verified), now HttpOnly. Session cookie: ends when the browser closes.
        add_header Set-Cookie "lw_session=$cookie_lw_session; Path=/; SameSite=Lax; HttpOnly$sig_cookie_secure" always;
        add_header Cache-Control "no-store" always;
        try_files /__none =204;
    }

    # --- Veil proxy (Browse + AI) ---
    # ^~ so the helper-file regex below never blocks proxied downloads (e.g. a .zip on another site).
    location ^~ /p/    { client_max_body_size 10m; proxy_pass http://veil; }
    location ^~ /__px/ { client_max_body_size 10m; proxy_pass http://veil; }
    location @veil     { client_max_body_size 10m; proxy_pass http://veil; }
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;               # includes the port: the proxy compares it to Origin/Referer
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $veil_proto;
    proxy_set_header Upgrade $http_upgrade;           # WebSockets
    proxy_set_header Connection $veil_connection;
    proxy_buffering off;                              # stream pages, downloads and AI answers
    proxy_request_buffering off;
    proxy_read_timeout 600s;                          # a paused video download can sit quiet for minutes
    proxy_send_timeout 600s;

    location = /games.json { add_header Cache-Control "private, no-cache"; try_files $uri =404; }
    # The site itself, fetched by the sign-in page after a correct password.
    location = /app { add_header Cache-Control "no-store" always; default_type text/html; try_files /index.html =404; }
    location /assets/     { add_header Cache-Control "private, no-cache"; try_files $uri =404; }   # no-cache: updates show up right away
    location /thumbnails/ { add_header Cache-Control "private, max-age=604800, immutable"; try_files $uri =404; }
    location /thumbs/     { add_header Cache-Control "private, max-age=604800, immutable"; try_files $uri =404; }   # smaller copies made at build time
    location /UGS-Files/  { add_header Cache-Control "private, max-age=86400"; try_files $uri =404; }

    location / { add_header Cache-Control "private, no-cache"; try_files $uri $uri/ /index.html; }

    # Never serve helper scripts/data if they end up in the image
    location ~* \.(ps1|bat|csv|log|zip|docx|sh)$ { return 404; }
}
