# Main nginx config for the combined image (replaces Alpine's /etc/nginx/nginx.conf).
# We ship our own so nothing depends on the layout of Alpine's default file. In particular,
# map_hash_bucket_size must come before the first "map" anywhere in the config: the password rule's
# 64-character token needs 128, and nginx rejects the setting once any map has been read.
user nginx;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    map_hash_bucket_size 128;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    access_log /dev/stdout;

    # 00-site-password.conf (written at startup) and gamestash.conf (the site + Browse/AI routes).
    include /etc/nginx/http.d/*.conf;
}
