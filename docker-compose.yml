# Optional: only needed if you deploy with Coolify's "Docker Compose" build pack.
# With the "Dockerfile" build pack, Coolify only needs Ports Exposes = 3847 and a SITE_PASSWORD variable.
services:
  gamestash:
    build: .
    expose:
      - "3847"
    environment:
      - SITE_PASSWORD=${SITE_PASSWORD}
      # Browse + AI: add the AI keys you use (see proxy/.env.example for every option)
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    restart: unless-stopped
