<!doctype html><html><head>
  <title>Street Fighter II Rainbow Edition</title></head><body><!doctype html>
<html>
<head></head>
<!-- This has a hack of Street Fighter 2 Champion Edition that inspired Street Fighter 2 Turbo. This should not be confused with any official entry. Here's an incomplete list of changes. You can press start (enter by default for Player 1) during the match to change characters. Gameplay speed was increased by about 25-30%. Special moves (for example, Ryu's Hadouken) can be used in midair. Said special moves are also capable of homing in on opponents. -->

<body>
	<!doctype html>
	<html>

	<head></head>

	<body>
		<html>



		<head>
			<script src="//www.google.com/jsapi"></script>
			<script>
				window.parent.maeExportApis_();
			</script>

			<style>
				body {
					overflow: hidden;
					background: #000000;
					margin-top: 0;
					margin-left: 0;
					color: #000000;
				}

				#startButton {
					display: block;
					width: 160px;
					height: 40px;
					background-color: #4CAF50;
					color: white;
					text-align: center;
					text-decoration: none;
					font-size: 16px;
					margin: 20px auto;
					padding: 10px 20px;
					border: none;
					border-radius: 8px;
					cursor: pointer;
					font-family: 'Press Start 2P', cursive;
					box-shadow: 0px 0px 10px 2px #000000;
				}
			</style>
			<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet">
			<style type="text/css">
				#button {
					display: none;
				}

				.imgb_vis {
					animation: imgb-animation 7s linear;
				}

				@keyframes imgb-animation {
					10% {
						transform: translateX(0);
					}

					20% {
						transform: translateX(100px);
					}

					90% {
						transform: translateX(100px);
					}

					100% {
						transform: translateX(0);
					}
				}
			</style>
		</head>

		<body>
			<div style="width: 100vw; height: 100vh;max-width:100%">
				<div id="game" style="display: none;"></div>
				<button id="startButton">PLAY</button>
			</div>
			<script>
				document.getElementById("game").style.display = "none";
            function startGame() {
                document.getElementById("game").style.display = "block";
                document.getElementById("startButton").style.display = "none";
                EJS_player = "#game";
                EJS_core = "arcade";
                EJS_color = "#00000";
                EJS_startOnLoaded = true;
                EJS_pathtodata = "https://cdn.jsdelivr.net/gh/ap-math-class/emu@main/";
                EJS_gameUrl = "https://cdn.jsdelivr.net/gh/Ray52511/Emujsgames@main/Street%20Fighter%202'%20Rainbow%20Edition/sf2rb.zip";
                loadGame();
            }
            document.getElementById("startButton").addEventListener("click", startGame);
            function loadGame() {
                var script = document.createElement("script");
                script.src = "https://cdn.jsdelivr.net/gh/ap-math-class/emu@main/loader.js";
                document.body.appendChild(script);
            }
			</script>
		</body>
		<html>
		<script type="text/javascript"></script>
	</body>
	<html></body><html>
