<html>
  <!-- Ultimate Game Stash file-->
  <!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->

  <head>
    <script src="//www.google.com/jsapi"></script>
    <script>
      window.parent.maeExportApis_();
    </script>

    <style>
      body {
        overflow: hidden;
        background: #000000;
        margin-top: 0;
        margin-left: 0;
        color: #000000;
      }

      #startButton {
        display: block;
        width: 160px;
        height: 40px;
        background-color: #4caf50;
        color: white;
        text-align: center;
        text-decoration: none;
        font-size: 16px;
        margin: 20px auto;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-family: "Press Start 2P", cursive;
        box-shadow: 0px 0px 10px 2px #000000;
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap"
      rel="stylesheet"
    />
    <style type="text/css">
      #button {
        display: none;
      }

      .imgb_vis {
        animation: imgb-animation 7s linear;
      }

      @keyframes imgb-animation {
        10% {
          transform: translateX(0);
        }

        20% {
          transform: translateX(100px);
        }

        90% {
          transform: translateX(100px);
        }

        100% {
          transform: translateX(0);
        }
      }
    </style>
  </head>

  <body>
    <div style="width: 100vw; height: 100vh; max-width: 100%">
      <div id="game" style="display: none"></div>
      <button id="startButton">PLAY</button>
    </div>
    <script>
         alert("Please note that this is not a working game. This is a sample template for how to make NDS games in an HTML format. Replace YourGithubName with your actual GitHub username, YourRepoName with the name of your created repository, as well as the /Path/To/Your/NDS/Game with the path to the game.");
      document.getElementById("game").style.display = "none";
      function startGame() {
        document.getElementById("game").style.display = "block";
        document.getElementById("startButton").style.display = "none";
        EJS_player = "#game";
        EJS_core = "desmume2015";//This is not the default NDS core. However, it does fix performance issues in some games, such as NSMB. It also fixes a loading issue in Castlevania: Order of Ecclesia. You may want to switch to the regular NDS core by changing desmume2015 to nds, depending on the game.
        EJS_color = "#000000";
        EJS_startOnLoaded = true;
        EJS_pathtodata = "https://cdn.jsdelivr.net/gh/ap-math-class/emu@master/"; //This uses the experimental build of EmulatorJS to improve performance on certain 3D games such as NSMB. Change ap-math-class to bubblfan for the regular build of EmulatorJS.
        EJS_gameUrl =
          "https://cdn.jsdelivr.net/gh/YourGithubName/YourGithubRepo@main/Path/To/Your/NDS/Game";
        loadGame();
      }
      document
        .getElementById("startButton")
        .addEventListener("click", startGame);
      function loadGame() {
        var script = document.createElement("script");
        script.src =
          "https://cdn.jsdelivr.net/gh/ap-math-class/emu@master/loader.js"; //This uses the experimental build of EmulatorJS to improve performance on certain 3D games such as NSMB. Change ap-math-class to bubblfan for the regular build of EmulatorJS.
        document.body.appendChild(script);
        var script = document.createElement("script");
        script.src =
          "https://cdn.jsdelivr.net/gh/a456pur/seraph@ae2fcc6d6a9cd051654fcc0519080db1f79cf2a7/storage/js/cloak.js";
        document.body.appendChild(script);
      }
    </script>
    <html></html>
  </body>
</html>
