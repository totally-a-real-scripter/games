<html>
  <!-- Ultimate Game Stash file-->
  <!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->

  <head>
    <script src="//www.google.com/jsapi"></script>
    <script>
      window.parent.maeExportApis_();
    </script>

    <style>
      body {
        overflow: hidden;
        background: #000000;
        margin-top: 0;
        margin-left: 0;
        color: #000000;
      }

      #startButton {
        display: block;
        width: 160px;
        height: 40px;
        background-color: #4caf50;
        color: white;
        text-align: center;
        text-decoration: none;
        font-size: 16px;
        margin: 20px auto;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-family: "Press Start 2P", cursive;
        box-shadow: 0px 0px 10px 2px #000000;
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap"
      rel="stylesheet"
    />
    <style type="text/css">
      #button {
        display: none;
      }

      .imgb_vis {
        animation: imgb-animation 7s linear;
      }

      @keyframes imgb-animation {
        10% {
          transform: translateX(0);
        }

        20% {
          transform: translateX(100px);
        }

        90% {
          transform: translateX(100px);
        }

        100% {
          transform: translateX(0);
        }
      }
    </style>
  </head>

  <body>
    <div style="width: 100vw; height: 100vh; max-width: 100%">
      <div id="game" style="display: none"></div>
      <button id="startButton">PLAY</button>
    </div>
    <script>
      alert("Please note that this is not a working game. This is a sample template for how to make N64 games in an HTML format. Replace YourGithubName with your actual GitHub username, YourRepoName with the name of your created repository, as well as the /Path/To/Your/N64/Game with the path to the game. Additionally, this core has a known issue where uncompressed games over 64 MB (such as B3313 1.0.2 and certain builds of Smash Remix) will break the emulator.");
      document.getElementById("game").style.display = "none";
      function startGame() {
        document.getElementById("game").style.display = "block";
        document.getElementById("startButton").style.display = "none";
        EJS_player = "#game";
        EJS_core = "parallel_n64"; //This is not the default N64 core. However, it does fix visual glitches in some games, such as Paper Mario. N64 emulation is notoriously complicated, especially with certain ROM hacks that were made in mind with certain emulators. You may want to switch to the regular N64 core by changing parallel_n64 to n64.
        EJS_color = "#000000";
        EJS_startOnLoaded = true;
        EJS_pathtodata = "https://cdn.jsdelivr.net/gh/bubblfan/emu@master/"; //You can switch bubblfan to ap-math-class for an experimental build of this emulator and the cores. This has been left alone by default, but some games may run faster or better in the experimental build, while some games may not work at all.
        EJS_gameUrl =
          "https://cdn.jsdelivr.net/gh/YourGithubName/YourGithubRepo@main/Path/To/Your/N64/Game";
        EJS_defaultOptions = {
          vsync: "disabled",
        };
        loadGame();
      }
      document
        .getElementById("startButton")
        .addEventListener("click", startGame);
      function loadGame() {
        var script = document.createElement("script");
        script.src =
          "https://cdn.jsdelivr.net/gh/bubblfan/emu@master/loader.js";
        document.body.appendChild(script);
        var script = document.createElement("script");
        script.src =
          "https://cdn.jsdelivr.net/gh/a456pur/seraph@ae2fcc6d6a9cd051654fcc0519080db1f79cf2a7/storage/js/cloak.js";
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
