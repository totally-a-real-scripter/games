  <body>
    <div class="gm4html5_div_class" id="gm4html5_div_id">
      <img src="html5game/splash.png" id="GM4HTML5_loadingscreen" alt="GameMaker:HTML5 loading screen" style="display: none" />
      <canvas id="canvas" width="960" height="540">

      </canvas>

    <!-- F = right click (bullet pass) for trackpads.
         Holding F holds the right button at the current cursor position. -->
    <script>
      (function () {
        var x = 0, y = 0, held = 0, fDown = false;

        // Remember where the cursor is and which real buttons are held.
        function track(e) {
          if (!e.isTrusted) return;
          x = e.clientX; y = e.clientY;
          if (typeof e.buttons === 'number') held = e.buttons & ~2;
        }
        ['pointermove', 'pointerdown', 'pointerup']
          .forEach(function (t) { window.addEventListener(t, track, true); });

        var pid = 1;
        window.addEventListener('pointermove', function (e) {
          if (e.isTrusted && e.pointerType === 'mouse') pid = e.pointerId;
        }, true);

        // Send exactly what a browser sends for a real right click.
        // Right button pressed while another button is held: a pointermove
        // with the right-button bit added (no new press, so the aim is kept).
        // Right button on its own: a normal pointerdown / pointerup.
        var chorded = false;
        function fire(down) {
          var el = document.getElementById('canvas');
          if (!el) return;
          var type;
          if (down) { chorded = held !== 0; type = chorded ? 'pointermove' : 'pointerdown'; }
          else { type = chorded ? 'pointermove' : 'pointerup'; }
          el.dispatchEvent(new PointerEvent(type, {
            bubbles: true, cancelable: true, composed: true, view: window,
            clientX: x, clientY: y, screenX: x, screenY: y,
            pointerId: pid, pointerType: 'mouse', isPrimary: true,
            button: 2, buttons: down ? (held | 2) : held
          }));
        }

        function isF(e) {
          return e.code === 'KeyF' || e.key === 'f' || e.key === 'F';
        }
        function typing(e) {
          var t = e.target;
          return t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
        }

        window.addEventListener('keydown', function (e) {
          if (!isF(e) || typing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
          e.preventDefault(); e.stopImmediatePropagation();
          if (fDown || e.repeat) return;
          fDown = true; fire(true);
        }, true);

        window.addEventListener('keyup', function (e) {
          if (!isF(e) || !fDown) return;
          e.preventDefault(); e.stopImmediatePropagation();
          fDown = false; fire(false);
        }, true);

        // Let go of the right button if the window loses focus mid-press.
        window.addEventListener('blur', function () {
          if (fDown) { fDown = false; fire(false); }
        });

        // No browser menu from our synthetic right click.
        document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);

        // Short on-screen reminder.
        window.addEventListener('load', function () {
          var h = document.createElement('div');
          h.id = 'fkeyHint';
          h.innerHTML = 'Bullet pass: right click or <kbd>F</kbd>';
          document.body.appendChild(h);
          setTimeout(function () { h.style.opacity = '0'; }, 5000);
          setTimeout(function () { h.remove(); }, 6000);
        });
      })();
    </script>
