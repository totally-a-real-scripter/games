# Nginx reverse proxy for Veil. Replace proxy.example.com and certificate paths.
# The app listens on 127.0.0.1:43117; set in .env:
#   TRUST_PROXY_HOPS=1
#   PUBLIC_HOSTNAMES=proxy.example.com
#   COOKIE_SECURE=true

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name proxy.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name proxy.example.com;

    ssl_certificate     /etc/letsencrypt/live/proxy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HSTS for the proxy's own origin (upstream HSTS headers are never forwarded).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Match MAX_REQUEST_BODY_BYTES.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:43117;
        proxy_http_version 1.1;

        # The app needs the original Host to build same-origin checks.
        proxy_set_header Host $host;
        # Overwrite (not append) so clients can't inject fake hops.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Stream responses (downloads, media) instead of buffering to disk.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
